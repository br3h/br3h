name: Refresh public development pulse

"on":
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br3h-profile-generated-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'br3h/br3h' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.12.0'
      - name: Test generator behavior
        run: npm test
      - name: Collect and render public data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run generate:pulse
      - name: Verify local references and SVG safety
        run: npm run verify
      - name: Publish only pulse outputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md generated/pulse.svg generated/pulse-light.svg generated/pulse.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public development pulse'
          git -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$GITHUB_TOKEN"; }; f' push origin HEAD:main
