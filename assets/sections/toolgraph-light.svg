44" y="325" class="muted" font-size="19" >TOOL DISCOVERY</text><text x="650" y="328" class="muted" font-size="19" >JSON SCHEMA / CHECKS</text></g><g class="reveal" style="--delay:1.95s" ><path d="M40 544H1160" class="rule" /><text x="40" y="580" class="muted" font-size="22" >MCP CLIENT → ENGINE → CANVAS</text><text x="40" y="617" class="ink" font-size="22" >apps/web · apps/engine · schema-core · codegen</text><text x="40" y="664" class="muted" font-size="18" >PACKAGE BOUNDARIES / DATA FLOW / SOURCE-BACKED SCHEMATIC</text></g></g><svg class="compact" width="1200" height="700" viewBox="0 0 600 350"><g class="reveal" style="--delay:0.1s" ><text x="24" y="38" class="ink" font-size="27" font-weight="600">03 / FLAGSHIP / TOOLGRAPH</text><path d="M24 55H576" class="rule" /></g><g class="reveal" style="--delay:0.7s" ><rect x="24" y="78" width="552" height="46" class="panel" /><text x="38" y="110" class="ink" font-size="25" >MCP TOOLS</text><text x="565" y="110" class="signal" font-size="25" text-anchor="end">JSON SCHEMAS</text></g><path d="M300 124V137" class="trace signal-line" pathLength="1" style="--delay:0.8s"/><g class="reveal" style="--delay:1s" ><rect x="24" y="137" width="552" height="46" class="panel" /><text x="38" y="169" class="ink" font-size="25" >MCP CLIENT</text><text x="565" y="169" class="signal" font-size="25" text-anchor="end">FASTIFY ENGINE</text></g><path d="M300 183V196" class="trace signal-line" pathLength="1" style="--delay:1.1s"/><g class="reveal" style="--delay:1.2999999999999998s" ><rect x="24" y="196" width="552" height="46" class="panel" /><text x="38" y="228" class="ink" font-size="25" >NEXT.JS CANVAS</text><text x="565" y="228" class="signal" font-size="25" text-anchor="end">SCHEMA CHECKS</text></g><path d="M300 242V255" class="trace signal-line" pathLength="1" style="--delay:1.4s"/><g class="reveal" style="--delay:1.5999999999999999s" ><rect x="24" y="255" width="552" height="46" class="panel" /><text x="38" y="287" class="ink" font-size="25"